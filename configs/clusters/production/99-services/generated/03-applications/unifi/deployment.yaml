{
   "apiVersion": "apps/v1",
   "kind": "Deployment",
   "metadata": {
      "annotations": {
         "kustomize.toolkit.fluxcd.io/substitute": "disabled"
      },
      "name": "unifi",
      "namespace": "default"
   },
   "spec": {
      "replicas": 1,
      "selector": {
         "matchLabels": {
            "app.kubernetes.io/name": "unifi"
         }
      },
      "strategy": {
         "rollingUpdate": {
            "maxSurge": 0,
            "maxUnavailable": "100%"
         }
      },
      "template": {
         "metadata": {
            "annotations": {
               "k8s.v1.cni.cncf.io/networks": "[\n    {\n        \"ips\": [\n            \"192.168.1.18/24\"\n        ],\n        \"name\": \"macvlan-static\"\n    }\n]"
            },
            "labels": {
               "app.kubernetes.io/name": "unifi"
            }
         },
         "spec": {
            "containers": [
               {
                  "env": [
                     {
                        "name": "TZ",
                        "value": "Australia/Sydney"
                     },
                     {
                        "name": "PUID",
                        "value": "1000"
                     },
                     {
                        "name": "PGID",
                        "value": "1000"
                     },
                     {
                        "name": "MONGO_HOST",
                        "value": "127.0.0.1"
                     },
                     {
                        "name": "MONGO_PORT",
                        "value": "27017"
                     }
                  ],
                  "envFrom": [
                     {
                        "secretRef": {
                           "name": "unifi"
                        }
                     }
                  ],
                  "image": "lscr.io/linuxserver/unifi-network-application",
                  "name": "unifi",
                  "volumeMounts": [
                     {
                        "mountPath": "/config",
                        "name": "unifi"
                     }
                  ]
               },
               {
                  "args": [
                     "--bind_ip",
                     "127.0.0.1"
                  ],
                  "envFrom": [
                     {
                        "secretRef": {
                           "name": "unifi"
                        }
                     }
                  ],
                  "image": "docker.io/library/mongo",
                  "livenessProbe": {
                     "exec": {
                        "command": [
                           "mongosh",
                           "--quiet",
                           "--eval",
                           "db.adminCommand({ ping: 1 })"
                        ]
                     },
                     "failureThreshold": 5,
                     "periodSeconds": 30,
                     "timeoutSeconds": 10
                  },
                  "name": "mongo",
                  "startupProbe": {
                     "exec": {
                        "command": [
                           "mongosh",
                           "--quiet",
                           "--eval",
                           "db.adminCommand({ ping: 1 })"
                        ]
                     },
                     "failureThreshold": 36,
                     "periodSeconds": 10
                  },
                  "volumeMounts": [
                     {
                        "mountPath": "/data/db",
                        "name": "unifi-db"
                     },
                     {
                        "mountPath": "/docker-entrypoint-initdb.d",
                        "name": "config"
                     }
                  ]
               },
               {
                  "image": "docker.io/library/nginx",
                  "name": "nginx",
                  "volumeMounts": [
                     {
                        "mountPath": "/etc/nginx/nginx.conf",
                        "name": "config",
                        "subPath": "nginx.conf"
                     }
                  ]
               }
            ],
            "enableServiceLinks": false,
            "initContainers": [
               {
                  "command": [
                     "/bin/sh",
                     "-ec",
                     "if [ ! -s /data/db/mongod.lock ] && [ ! -f /data/db/_repair_incomplete ]; then\n  echo 'mongodb: clean shutdown, no repair needed'\n  exit 0\nfi\necho 'mongodb: unclean shutdown detected, running repair'\nexec gosu mongodb mongod --dbpath /data/db --repair\n"
                  ],
                  "image": "docker.io/library/mongo",
                  "name": "mongo-repair",
                  "volumeMounts": [
                     {
                        "mountPath": "/data/db",
                        "name": "unifi-db"
                     }
                  ]
               }
            ],
            "serviceAccountName": "unifi",
            "volumes": [
               {
                  "configMap": {
                     "name": "unifi"
                  },
                  "name": "config"
               },
               {
                  "name": "unifi",
                  "persistentVolumeClaim": {
                     "claimName": "unifi"
                  }
               },
               {
                  "name": "unifi-db",
                  "persistentVolumeClaim": {
                     "claimName": "unifi-db"
                  }
               }
            ]
         }
      }
   }
}
