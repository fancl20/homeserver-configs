{
   "apiVersion": "networking.k8s.io/v1",
   "kind": "NetworkPolicy",
   "metadata": {
      "name": "allow-source-controller-artifacts",
      "namespace": "flux-system"
   },
   "spec": {
      "ingress": [
         {
            "from": [
               {
                  "namespaceSelector": {
                     "matchLabels": {
                        "kubernetes.io/metadata.name": "continuous"
                     }
                  }
               }
            ],
            "ports": [
               {
                  "port": "http",
                  "protocol": "TCP"
               }
            ]
         }
      ],
      "podSelector": {
         "matchLabels": {
            "app": "source-controller"
         }
      },
      "policyTypes": [
         "Ingress"
      ]
   }
}
