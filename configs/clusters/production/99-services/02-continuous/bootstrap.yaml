# Bootstrap: build the image-controller image once, before the controller
# itself exists. Runs entirely on public images and in-cluster services: the
# prepare container reads the configs artifact URL and digest from the
# GitRepository status (using the controller's own ServiceAccount, whose
# ClusterRole in image-controller.yaml grants read access to gitrepositories),
# downloads and verifies the tarball, and the build pushes a sentinel tag.
#
# NOT applied by Flux (see the ignore annotation below): as a Flux-managed
# manifest it would run on merge and be re-created after every TTL expiry,
# rebuilding whatever main holds on a weekly cadence nobody asked for. Apply
# it by hand on a fresh cluster or after a registry wipe, once Flux has
# applied image-controller.yaml (the RBAC must exist):
#
#   kubectl apply -f configs/clusters/production/99-services/02-continuous/bootstrap.yaml
#
# Recovery then flows through image automation: with an empty registry the
# sentinel is the only tag, the image-controller ImagePolicy (semver
# *-testing-, 1h scan) selects it, and ImageUpdateAutomation rewrites the
# Deployment pin — expect up to ~1.5h before the controller starts. Its first
# real build pushes <version>-testing-<base>, which outranks 0.0.0 and moves
# the pin back up.
#
# Idempotent (re-pushes the same tag); backoffLimit rides out the
# registry/DNS/network-policy chain coming up.
apiVersion: batch/v1
kind: Job
metadata:
  name: image-controller-bootstrap
  namespace: continuous
  annotations:
    kustomize.toolkit.fluxcd.io/ignore: "true"
spec:
  backoffLimit: 20
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        d20.fan/container-image: image-controller
    spec:
      restartPolicy: Never
      serviceAccountName: image-controller
      securityContext:
        fsGroup: 1000
      volumes:
      - name: work
        emptyDir:
          sizeLimit: 8Gi
      initContainers:
      - name: prepare
        image: docker.io/library/python:3.14.8-slim # {"$imagepolicy": "flux-system:python"}
        command:
        - python3
        - -c
        - |
          import hashlib, io, json, os, pathlib, ssl, tarfile, urllib.request

          def get(url, token=None):
              req = urllib.request.Request(url, headers={'Authorization': token} if token else {})
              ctx = ssl.create_default_context(cafile='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt') \
                  if url.startswith('https') else None
              with urllib.request.urlopen(req, timeout=300, context=ctx) as r:
                  return r.read()

          sa = pathlib.Path('/var/run/secrets/kubernetes.io/serviceaccount')
          token = 'Bearer ' + (sa / 'token').read_text()
          repo = json.loads(get(
              'https://kubernetes.default.svc/apis/source.toolkit.fluxcd.io'
              '/v1/namespaces/flux-system/gitrepositories/configs', token))
          artifact = repo['status']['artifact']
          print(f"bootstrap: artifact {artifact['revision']}")

          buf = get(artifact['url'])
          algorithm, _, expected = artifact['digest'].partition(':')
          actual = hashlib.new(algorithm, buf).hexdigest()
          if actual != expected:
              raise SystemExit('bootstrap: digest mismatch')

          src = pathlib.Path('/work/src')
          src.mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(buf), mode='r:gz') as tf:
              for m in tf.getmembers():
                  n = os.path.normpath(m.name)
                  if n.startswith('/') or '..' in pathlib.PurePosixPath(n).parts:
                      raise SystemExit(f'unsafe path in artifact: {m.name}')
              tf.extractall(src, filter='data')
          print('bootstrap: artifact extracted')
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: work
          mountPath: /work
      containers:
      - name: build
        image: docker.io/moby/buildkit:v0.34.0-rootless # {"$imagepolicy": "flux-system:buildkit"}
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          cd "/work/src/$CONTEXT"
          ref="$REGISTRY_HOST/$IMAGE_NAME:$TAG"
          echo "bootstrap: building $ref"
          buildctl-daemonless.sh build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            --output "type=image,name=$ref,push=true" \
            --export-cache type=inline \
            --import-cache "type=registry,ref=$ref"
          echo "bootstrap: pushed $ref"
        env:
        - name: BUILDKITD_FLAGS
          value: --oci-worker-no-process-sandbox
        - name: REGISTRY_HOST
          value: registry.local.d20.fan
        - name: IMAGE_NAME
          value: fancl20/image-controller
        - name: TAG
          # Sentinel: semver-below every real release, so the ImagePolicy
          # only ever selects it when the registry holds no real tag.
          value: 0.0.0-testing-00000000
        - name: CONTEXT
          value: 99-services/02-continuous/controller
        securityContext:
          seccompProfile:
            type: Unconfined
          appArmorProfile:
            type: Unconfined
          runAsUser: 1000
          runAsGroup: 1000
        workingDir: /work/src
        volumeMounts:
        - name: work
          mountPath: /work
