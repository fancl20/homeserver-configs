# image-controller: builds ContainerImages from Flux source artifacts.
# The CRD lives in d20.fan_containerimages.yaml (controller-gen output).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-controller
  namespace: continuous
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: image-controller
rules:
- apiGroups:
  - d20.fan
  resources:
  - containerimages
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - d20.fan
  resources:
  - containerimages/status
  - containerimages/finalizers
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - gitrepositories
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - image.toolkit.fluxcd.io
  resources:
  - imagepolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: image-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: image-controller
subjects:
- kind: ServiceAccount
  name: image-controller
  namespace: continuous
---
# Job and pod access is scoped to the build namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: image-controller
  namespace: continuous
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
  - create
  - delete
  - deletecollection
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: image-controller
  namespace: continuous
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: image-controller
subjects:
- kind: ServiceAccount
  name: image-controller
  namespace: continuous
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-controller
  namespace: continuous
  labels:
    app.kubernetes.io/name: image-controller
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 100%
  selector:
    matchLabels:
      app.kubernetes.io/name: image-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: image-controller
    spec:
      serviceAccountName: image-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: image-controller
        image: registry.local.d20.fan/fancl20/image-controller:0.1.0-testing-20260824
        args:
        - docker.io/library/python:3.14.8-slim # {"$imagepolicy": "flux-system:python"}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        ports:
        - name: healthz
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
---
# Open source-controller's artifact API to the build namespace. The stock
# Flux NetworkPolicies only allow same-namespace ingress (plus 8080/9292).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-source-controller-artifacts
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
      app: source-controller
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: continuous
    ports:
    - protocol: TCP
      port: http
