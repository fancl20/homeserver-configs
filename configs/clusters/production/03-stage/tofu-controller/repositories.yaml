# Used in components/terrafrom
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: tf-runner
  namespace: flux-system
spec:
  image: ghcr.io/flux-iac/tf-runner
  interval: 1h
  exclusionList:
    - '^.*\.sig$'
    - '^.*-base$'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: tf-runner
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: tf-runner
  filterTags:
    pattern: '(?P<semver>.*)-rc\.(?P<rcver>\d+)$'
    extract: '$semver-rc$rcver'
  policy:
    semver:
      range: '*-rc'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: terraform
  namespace: flux-system
spec:
  image: docker.io/hashicorp/terraform
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: terraform
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: terraform
  policy:
    semver:
      range: '1.x'
